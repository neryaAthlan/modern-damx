[workspace]
resolver = "2"
members = [
    "crates/damx-core",
    "crates/damx-cli",
    "crates/damx-daemon",
    "crates/damx-gui",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/neryaAthlan/modern-damx"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"
damx-core = { path = "crates/damx-core" }

[profile.release]
strip = true
lto = "thin"
